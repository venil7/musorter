[package]
name = "musorter"
version = "0.1.0"
edition = "2024"
description = "A music collection sorter: reads audio metadata and moves/copies files into a deterministic, template-driven folder structure."

[[bin]]
name = "musorter"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
lofty = "0.25"
walkdir = "2"
md-5 = "0.10"
hex = "0.4"
thiserror = "2"
unicode-normalization = "0.1"
indicatif = "0.18.6"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[profile.release]
lto = "thin"
strip = true
